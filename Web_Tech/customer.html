<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Customer</title>
</head>
<body>
    <header>
        Bekary Management System
    </header>
    <nav>
        
            <button href="#" onclick="showpage('home')">Home</button>
            <button href="#" onclick="showpage('cart')">Cart</button>
            <button href="#" onclick="showpage('checkout')">Checkout</button>
            <button href="#" onclick="showpage('orders')">Order History</button>
            <button href="#" onclick="showpage('login')">Login</button>
        
    </nav>
    <div class ="container">
        <div id ="home">
            <h2>Our Products</h2>
            <div id="product-list"></div>   
            <div id ="cart" class ="hidden">
                <h2>Your Cart</h2>
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items"></tbody>
                </table>
                <h3 id="cart-total">Total: $0</h3>
            </div>
            <div id ="checkout" class ="hidden">
                <h2>Checkout</h2>
                <form onsubmit="placeorder(event)">
                    <label>Delivery Option:</label>
                    <select id="delivery-option" required>
                        <option value="pickup">Pickup</option>
                        <option value="delivery">Delivery</option>
                    </select>
                    <label>Address:</label>
                    <input type="text" id="delivery-address" placeholder="Enter your address"/>
                    <label>Payment Method:</label>
                    <select>
                        <option>Cash On Delivery</option>
                    </select>
                    <button type="submit">Confirm Order</button>
                </form>
            </div>
            <div id="orders" class ="hidden">
                <h2> Order History  </h2>
                <ul id="order-history"></ul>
            </div>
            <div id="login" class="hidden">
                <h2>Login/Register</h2>
                <form onsubmit="Login(event)">
                    <input type="email" id="email" placeholder="Email" required />
                    <input type="password" id="password" placeholder="Password" required />
                    <button type="submit">Login</button>
                </form>
                <p>Or Resister below:</p>
                <form onsubmit="register(event)">
                    <input type="text" id="name" placeholder="Name" required />
                    <input type="email" id="reg-email" placeholder="Email" required />
                    <input type="password" id="reg-password" placeholder="Password" required />
                    <button type="submit">Register</button>
                </form>"
            </div>
                
        </div>
    </div>
</body>
</html>
